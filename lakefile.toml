name = "RiemannBlueprint"
version = "3.0.0"
description = "Axiom-free Lean 4 formalizations of classical equivalences and unconditional theorems in analytic number theory (NO_RH_PROOF = TRUE)"
keywords = ["math", "number-theory", "riemann-zeta", "lean4"]
homepage = "https://github.com/Qamarbajwa/RiemannBlueprint"
repository = "https://github.com/Qamarbajwa/RiemannBlueprint"
license = "Apache-2.0"
defaultTargets = ["RiemannBlueprint"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "RiemannBlueprint"
