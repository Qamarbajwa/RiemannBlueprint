name: Lean 4 Formal Verification CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lean4-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan and Lean toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Build RiemannBlueprint, UnconditionalTitchmarshBridge, and MatrixFactorizationAndHalfObservation
        run: |
          lake build
          lake build RiemannBlueprint.UnconditionalTitchmarshBridge
          lake build RiemannBlueprint.MatrixFactorizationAndHalfObservation

      - name: Verify zero sorry tokens in proof code and standard axioms
        run: |
          python3 -c '
          import pathlib, re
          bad = []
          for p in sorted(pathlib.Path("RiemannBlueprint").rglob("*.lean")):
              lines = p.read_text(encoding="utf-8").splitlines()
              in_block = False
              for i, line in enumerate(lines, 1):
                  if "/-" in line: in_block = True
                  if "-/" in line: in_block = False; continue
                  if in_block: continue
                  code = line.split("--")[0]
                  if re.search(r"\b(sorry|admit)\b", code):
                      bad.append(f"{p}:{i}: {code.strip()}")
          assert not bad, f"Found sorry/admit in proof code: {bad}"
          print("Zero sorry/admit across all Lean proof code.")
          '
          lake env lean --stdin <<'EOF'
          import RiemannBlueprint.UnconditionalTitchmarshBridge
          import RiemannBlueprint.OpenStripRouche
          import RiemannBlueprint.MatrixFactorizationAndHalfObservation
          #print axioms titchmarshMellinProperty_unconditional
          #print axioms riemannHypothesis_of_purePlaque_vanishing_unconditional
          #print axioms riemannHypothesis_of_logarithmic_plaque_bound_unconditional
          #print axioms RiemannBlueprint.OpenStripRouche.rectRoucheProperty_unconditional
          #print axioms RiemannBlueprint.OpenStripRouche.theorem1_rouche_zero_exclusion_unconditional
          #print axioms RiemannBlueprint.OpenStripRouche.theorem2_rouche_exhaustion_implies_rh_unconditional
          #print axioms RiemannBlueprint.MatrixHalfObservation.floorMatrix_eq_cumSum_mul_divisor
          #print axioms RiemannBlueprint.MatrixHalfObservation.inverse_floorMatrix_mul
          #print axioms RiemannBlueprint.MatrixHalfObservation.upperHalf_observation_zero
          #print axioms RiemannBlueprint.MatrixHalfObservation.halfObservation_quadForm_eq_double_half
          #print axioms RiemannBlueprint.MatrixHalfObservation.harmonicCellL2PartialSum_period_eq_double_halfObservation
          #print axioms RiemannBlueprint.MatrixHalfObservation.unitDefectMatrix_offline_zero_floor_unconditional
          #print axioms RiemannBlueprint.MatrixHalfObservation.riemannHypothesis_of_unitDefectMatrix_vanishing_unconditional
          #print axioms RiemannBlueprint.MatrixHalfObservation.discreteCellResidual_cBaseAnchor_eq_neg_one_pow
          #print axioms RiemannBlueprint.MatrixHalfObservation.parityObsMatrix_mulVec_baseClockVec
          #print axioms RiemannBlueprint.MatrixHalfObservation.parityObsMatrix_conj_slabWeightMatrix
          #print axioms RiemannBlueprint.MatrixHalfObservation.palindromicProjMinus_annihilates_odd_metric
          #print axioms RiemannBlueprint.MatrixHalfObservation.unitDefectMatrix_eq_simplexLift_conj_augClockGram
          #print axioms RiemannBlueprint.MatrixHalfObservation.dipoleGramMatrix_quadForm_ge_half_sq
          EOF
