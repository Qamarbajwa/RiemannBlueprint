name: Lean Action CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RiemannBlueprint
        uses: actions/checkout@v4

      - name: Build and verify with lean-action
        uses: leanprover/lean-action@v1
        with:
          build-args: "RiemannBlueprint"
          lint: false
          test: false
